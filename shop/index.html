<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Northstar — a responsive product catalog demo built with modular JavaScript.">
  <title>Northstar — Product Catalog</title>
  <link rel="preload" href="assets/hero.svg" as="image" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="#/" aria-label="Northstar home"><span class="brand-mark">✦</span> northstar</a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="#/">Shop</a><a href="#/about">Our story</a>
    </nav>
    <button class="cart-button" id="cart-button" aria-label="Open shopping cart">Bag <span id="cart-count">0</span></button>
  </header>
  <main id="app" tabindex="-1" aria-live="polite"></main>
  <footer class="site-footer">
    <a class="brand footer-brand" href="#/">✦ northstar</a>
    <p>Thoughtful essentials. Better everyday.</p>
    <small>Student capstone demo · No real purchases are processed.</small>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
